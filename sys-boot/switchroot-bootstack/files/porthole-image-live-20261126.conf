# How Porthole makes the live SD card image of this system (its crossdev
# plugin: "Make an image..."). The whole system as a squashfs on the SD
# card's FAT partition, booted by hekate with live=1: the kernel has the
# live initramfs built in (USE=livecd), which mounts the squashfs with a
# tmpfs over it (dracut dmsquash-live). Nothing is kept between boots.

[image]
title = Live SD card
about = A live system (recovery, installer) that boots from the SD card's FAT partition and keeps nothing between boots. Copy everything in the card folder to the root of the SD card's FAT partition (hekate's), then pick "L4T Gentoo installer" in hekate's More configs.
needs = sys-kernel/nintendo-switch-l4t-kernel[livecd] sys-boot/switchroot-bootstack[livecd]
squashfs = switchroot/gentoo-installer/rootfs.squashfs
compression = xz
# FAT32: 4 GiB less a byte a file
max_file_size = 4294967295

[files]
bootloader/ini/L4T-gentoo-installer.ini = /usr/share/sdcard1/bootloader/ini/L4T-gentoo-installer.ini
switchroot/gentoo-installer/boot.scr = /usr/share/sdcard1/switchroot/gentoo-installer/boot.scr
switchroot/gentoo-installer/bl31.bin = /usr/share/sdcard1/switchroot/gentoo/bl31.bin
switchroot/gentoo-installer/bl33.bin = /usr/share/sdcard1/switchroot/gentoo/bl33.bin
switchroot/gentoo-installer/uImage = /boot/uImage
switchroot/gentoo-installer/nx-plat.dtimg = /boot/nx-plat.dtimg
switchroot/gentoo/icon_gentoo.bmp = /usr/share/sdcard1/switchroot/gentoo/icon_gentoo.bmp
switchroot/gentoo/icon_gentoo_hue.bmp = /usr/share/sdcard1/switchroot/gentoo/icon_gentoo_hue.bmp
